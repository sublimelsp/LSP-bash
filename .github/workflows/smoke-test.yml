name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The diagnostics come from ShellCheck, which only the Ubuntu runner has installed.
      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install ShellCheck (Windows)
        if: runner.os == 'Windows'
        run: choco install shellcheck --no-progress

      - uses: sublimelsp/lsp_smoke_test@v1
