name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      # The diagnostics come from ShellCheck, which only the Ubuntu runner has installed.
      - name: Install ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Install ShellCheck (Windows)
        if: runner.os == 'Windows'
        run: choco install shellcheck --no-progress

      - uses: sublimelsp/lsp_smoke_test@v1

  # A single check whose name doesn't depend on the os matrix, for rulesets to require. It runs even when the workflow
  # is cancelled: a skipped job counts as passing for a required check.
  result:
    name: Smoke test result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Smoke test result: $RESULT"
          test "$RESULT" = success
